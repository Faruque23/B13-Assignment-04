<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>

    <!-- Font   -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geist:wght@100..900&display=swap" rel="stylesheet">

    <!-- Tailwind + DaisyUI -->
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <!--Fontawesome  -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            font-family: 'Geist', sans-serif;
        }
    </style>

</head>

<body>
    <header>

        <div class="navbar bg-base-100 shadow-sm px-20">
            <a class="btn btn-ghost text-xl">Job Application Tracker</a>
        </div>
    </header>
    <main>
        <!-- Dashboard -->
        <section class="mt-10 px-20">
            <div>
                <h2 class="text-xl font-bold">Dashboard</h2>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4  mt-4">
                <div class="card bg-base-100 shadow p-4">
                    <div class="text-sm font-bold text-base-content/70">Total</div>
                    <div id="total-count" class="text-xl font-bold mt-2">0</div>
                </div>
                <div class="card bg-base-100 shadow p-4">
                    <div class="text-sm text-base-content/70 font-bold ">Interview</div>
                    <div id="interview-count" class="text-xl font-bold mt-2 text-green-700">0</div>
                </div>
                <div class="card bg-base-100 shadow p-4">
                    <div class="text-sm text-base-content/70 font-bold">Rejected</div>
                    <div id="rejected-count" class="text-xl font-bold mt-2 text-red-700">0</div>
                </div>
            </div>
        </section>
        <section class="mt-6 px-20">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-semibold">Available Jobs</h2>
                <div id="right-count" class="text-sm font-bold text-base-content/70">0<span>Jobs</span></div>
            </div>

            <nav class="tabs mt-3" aria-label="Job tabs">
                <button class="tab tab-bordered tab-active font-bold" data-tab="All">All</button>
                <button class="tab tab-bordered font-bold text-green-700" data-tab="Interview">Interview</button>
                <button class="tab tab-bordered font-bold text-red-700" data-tab="Rejected">Rejected</button>
            </nav>

            <div id="jobs-container" class="grid grid-cols-1 sm:grid-cols-3 gap-4 mt-4"></div>

            <template id="empty-template">
                <div class="flex flex-col items-center p-8 text-center text-base-content/70">
                    <img src="./image/jobs.png" alt="jobs" class="w-32 h-32 mt-4 mb-4">
                    <h3 class="mt-4 text-base font-medium">No jobs available</h3>
                    <p class="mt-2 text-sm">There are no jobs in this category. Try marking some as Interview or
                        Rejected.</p>
                </div>
            </template>
        </section>

    </main>

    <script src="./script/script.js"></script>

</body>

</html>
